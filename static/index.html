<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Shift Copilot</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
</head>
<body>
  <div id="login" class="modal hidden" role="dialog" aria-labelledby="login-title">
    <form id="login-form" class="card">
      <p class="kicker">SMART SHIFT COPILOT</p>
      <h1 id="login-title">Sign in</h1>
      <label>Your name<input id="login-name" name="name" autocomplete="username" required minlength="2" maxlength="40" placeholder="Your name"></label>
      <label>Team password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Enter</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="dot"></span>
        <div><strong>Smart Shift Copilot</strong><small id="who"></small></div>
      </div>
      <button id="new-chat" class="primary wide">+ New chat</button>
      <nav id="conversations" class="conversations" aria-label="Conversations"></nav>
      <div class="sidebar-foot">
        <button id="logout" class="ghost">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 id="conv-title">New chat</h2>
        <span id="status" class="status"></span>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Type a message…" required></textarea>
        <button id="send" type="submit" class="primary">Send</button>
      </form>
    </main>

  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
