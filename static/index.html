<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111618" media="(prefers-color-scheme: dark)">
  <title>Smart Shift Copilot</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/heebo-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/strings.js" defer></script>
  <script src="/static/markdown.js" defer></script>
  <script src="/static/availability.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- Icon sprite: one consistent set (24x24, 1.75 stroke), referenced with <use>. -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-3.7 3.9-5.6 7.5-5.6s6.6 1.9 7.5 5.6"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7z"/><path d="M18.5 15.5c.2 1.5.9 2.2 2.4 2.4-1.5.2-2.2.9-2.4 2.4-.2-1.5-.9-2.2-2.4-2.4 1.5-.2 2.2-.9 2.4-2.4z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h3"/><path d="M14.5 8 19 12l-4.5 4"/><path d="M19 12H9.5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-4.5 16-3.5-6.5L4 12z"/><path d="M12 13.5 20 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.5h.01"/></symbol>
  </svg>

  <a class="skip" href="#main" data-t="app.skip"></a>
  <noscript><p class="noscript">יש להפעיל JavaScript כדי להשתמש במערכת.</p></noscript>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Login -->
  <section id="view-login" class="login" hidden aria-labelledby="login-title">
    <div class="card login-card">
      <header>
        <span class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-sparkle"/></svg></span><span data-t="app.name"></span></span>
        <div>
          <h1 id="login-title" data-t="login.title"></h1>
          <p class="muted" data-t="login.intro"></p>
        </div>
      </header>
      <form id="login-form" novalidate>
        <div id="login-notice" class="notice" role="alert" hidden></div>
        <div class="field">
          <label for="login-name" data-t="login.name"></label>
          <input id="login-name" class="input" name="username" type="text" dir="auto" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" required>
        </div>
        <div class="field">
          <label for="login-code" data-t="login.code"></label>
          <span class="input-wrap">
            <input id="login-code" class="input ltr" name="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="200" aria-describedby="login-code-hint" required>
            <button id="login-toggle" class="btn btn-quiet icon-btn" type="button" data-t-aria-label="login.showCode" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
          </span>
          <span id="login-code-hint" class="hint" data-t="login.codeHint"></span>
        </div>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit"><span data-t="login.submit"></span></button>
      </form>
      <p class="login-foot" data-t="app.demoNote"></p>
    </div>
  </section>

  <!-- Application shell (manager and employee; the role decides what main shows) -->
  <div id="view-app" class="shell" hidden>
    <header class="appbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-sparkle"/></svg></span><span data-t="app.name"></span></span>
      <div class="appbar-user"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span id="appbar-name"></span></div>
    </header>
    <nav id="nav" class="nav" data-t-aria-label="nav.label"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <!-- Legal notice -->
  <dialog id="dlg-legal" aria-labelledby="dlg-legal-title">
    <div class="dialog-body">
      <h2 id="dlg-legal-title" data-t="account.legalTitle"></h2>
      <p data-t="account.legal"></p>
    </div>
    <form method="dialog" class="dialog-actions"><button class="btn btn-primary" data-t="account.ok"></button></form>
  </dialog>
</body>
</html>
