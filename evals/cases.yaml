# Eval cases for Smart Shift Copilot. Each case is one user turn against a fresh
# database. Facts (tool calls) are graded exactly; wording is graded by a cheaper
# model with the rubric, when --judge is on.
#
# A case may carry `history`: earlier turns, stored as messages the way the app
# stores them, so the model gets them as it would in production.
#
# These evals call the real model and cost money: do not run them without the
# owner's approval (practice.md section 5). Real cases arrive with the Copilot
# issues (M2-1, M4-1). The single case below only keeps the runner exercised.

- id: placeholder_no_tools_available
  input: "Who has not submitted their shifts for next week?"
  expect:
    tools_not_called: [get_submission_status]
    answer_not_contains: ["Noa", "Dan"]
  rubric: "Says it has no data connected yet; does not invent names."
