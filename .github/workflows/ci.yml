name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  tests:
    name: tests (SQLite, model mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        env:
          MODEL_PROVIDER: fake
          MANAGER_PASSWORD: ci-manager-password
          APP_SECRET: ci-secret-not-for-production
        run: |
          alembic upgrade head
          alembic check
          pytest -q

  tests-postgres:
    name: tests (PostgreSQL 16, model mocked)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODEL_PROVIDER: fake
      MANAGER_PASSWORD: ci-manager-password
      APP_SECRET: ci-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shift_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shift_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: migrations apply to an empty PostgreSQL and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: pytest on PostgreSQL
        run: pytest -q

  evals:
    name: evals (real model, only when a key is configured)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [tests, tests-postgres]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run evals
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m evals.run --baseline 0.8
      - name: skipped
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret not set; evals skipped. Add it in Settings → Secrets to gate PRs on the agent's behaviour."
